name: Container Build, CI & CD to Docker Hub

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-and-deploy:
    name: Build, Test & Deploy Container
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Autenticación en Docker Hub (solo si es un evento 'push')
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. CI: Compilar la imagen y cargarla localmente para la prueba
      - name: Build Docker Image (CI)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fastapi-todo:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. CI: Ejecutar la prueba de salud del contenedor
      - name: Test Container Execution & Health Check
        run: |
          docker run -d --name test-api -p 8000:8000 fastapi-todo:ci-${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8000/todos || exit 1
          docker stop test-api
          docker rm test-api

      # 6. CD: Publicar la imagen en Docker Hub (solo si las pruebas pasaron y fue un 'push' a main/master)
      - name: Push Image to Docker Hub (CD)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-todo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-todo:${{ github.sha }}
          cache-from: type=gha
